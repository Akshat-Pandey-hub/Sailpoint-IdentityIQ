# =============================================================================
# KF Agent / IIQ migration tool - logging configuration (Log4j2, used through SLF4J)
#
# This is the default bundled in the jar. To use your own copy without rebuilding:
#     java -Dlog4j2.configurationFile=/opt/kfagent/log4j2.properties -jar iiq-migration-tool.jar ...
#   or set the environment variable LOG4J_CONFIGURATION_FILE=/opt/kfagent/log4j2.properties
#
# Level: set KF_LOG_LEVEL = normal | debug | off   (default: normal)
#        normal -> INFO, debug -> DEBUG, off -> WARN (errors, warnings and rejected requests are still
#        written with their reason; only routine lines are dropped). The application maps it to the system
#        property kf.log.level before logging starts; -Dkf.log.level=... on the command line wins.
# Log folder: KF_LOG_DIR (default: ./logs, relative to the directory the service starts in;
#             suggested on Linux: /opt/kfagent/logs). If it cannot be created or written, Log4j reports it
#             at startup and the application keeps logging to the console.
#
# Secrets: IIQ_PASSWORD is never written at any level. At normal level usernames and the
# KF Agent client credentials are not written either. Data payloads are never logged.
# =============================================================================

status = warn
name = KfAgentLogging

property.logDir = ${sys:kf.log.dir:-logs}
property.level = ${sys:kf.log.level:-INFO}
property.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} | %-5level | %t | %c{1.} | %m%n

# --- console (on a server this is what journalctl shows) ----------------------
appender.console.type = Console
appender.console.name = CONSOLE
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

# --- rolling file: logs/kfagent.log ------------------------------------------
# Rolls daily and whenever the file reaches 10 MB; old files are gzipped.
# Keeps at most 10 rolled files per day and deletes rolled files older than 30 days.
appender.file.type = RollingFile
appender.file.name = FILE
appender.file.fileName = ${logDir}/kfagent.log
appender.file.filePattern = ${logDir}/kfagent-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${pattern}
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10
appender.file.strategy.delete.type = Delete
appender.file.strategy.delete.basePath = ${logDir}
appender.file.strategy.delete.maxDepth = 1
appender.file.strategy.delete.ifFileName.type = IfFileName
appender.file.strategy.delete.ifFileName.glob = kfagent-*.log.gz
appender.file.strategy.delete.ifLastModified.type = IfLastModified
appender.file.strategy.delete.ifLastModified.age = 30d

# --- levels --------------------------------------------------------------------
rootLogger.level = ${level}
rootLogger.appenderRef.console.ref = CONSOLE
rootLogger.appenderRef.file.ref = FILE

# Third-party libraries stay quiet unless they report a problem.
logger.duckdb.name = org.duckdb
logger.duckdb.level = warn
logger.postgres.name = org.postgresql
logger.postgres.level = warn
